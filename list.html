<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트(목록 태그)</title>
</head>
<body>
    <!--
        태그의 역할을 맞춰서 사용해야하는 이유
        SEO
        목록 태그(ol, ul, li)
        1. ol, li: 순서가 있는 리스트
        2. ul, li: 순서가 없는 리스트
    -->
    <ul>
        <li>위: NEON</li>
        <li>위: 퇴사할게요</li>
        <li>위: 안녕히가세요</li>
    </ul>
</body>
</html>
